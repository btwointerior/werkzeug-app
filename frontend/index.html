<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Werkzeug-Ausleihe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    /* iOS-Safari: Tap-Highlight reduzieren */
    button, a { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header id="topbar" class="hidden sticky top-0 z-40 bg-white border-b border-slate-200"></header>

  <div id="app" class="min-h-[calc(100vh-8rem)]"></div>

  <nav id="bottomnav" class="hidden fixed bottom-0 left-0 right-0 z-40"></nav>

  <!-- Overlay-Container -->
  <div id="toasts" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center pointer-events-none"></div>
  <div id="modal-root"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
