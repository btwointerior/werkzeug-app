<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <title>Werkzeug-Ausleihe</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/icons/icon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/icons/icon-180.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0b0f1a',
            surface: '#151b2b',
            'surface-2': '#28344f',
            border: '#28344f',
            accent: '#d4f000',
            'accent-ink': '#0b0f1a',
            txt: '#ffffff',
            'txt-2': '#cbd5e1',
            muted: '#94a3b8',
            'muted-2': '#64748b',
            ok: '#34d399',
            lent: '#60a5fa',
            broken: '#f87171',
            maint: '#fbbf24',
          },
        },
      },
    };
  </script>
  <style>
    html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    /* Kein Pinch-/Doppeltipp-Zoom: versehentliches Zoomen ließ die ganze App
       horizontal "schwimmen" (Layout wirkt instabil). App-UI ist fix skaliert. */
    html { touch-action: pan-x pan-y; }
    button, a, input, select, textarea, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    /* iOS-Safe-Area (native App/PWA): Kopfzeile nicht unter der Statusleiste,
       Bottom-Nav nicht unter dem Home-Balken. Im Browser ist env() = 0. */
    #topbar { padding-top: env(safe-area-inset-top); }
    #bottomnav { padding-bottom: env(safe-area-inset-bottom); background: #0b0f1a; }
    /* Fixierte Aktionsleisten (AUSLEIHEN etc.) sitzen direkt über der
       Bottom-Nav — die ist um die Safe-Area höher als ihre 4rem (h-16). */
    .fixed.bottom-16 { bottom: calc(4rem + env(safe-area-inset-bottom)); }
    /* Seiten mit fixierter Aktionsleiste: genug Platz am Seitenende, damit der
       letzte Inhalt (z.B. NFC-Button) nicht hinter der Leiste verschwindet. */
    .pb-aktionsleiste { padding-bottom: calc(11rem + env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="bg-bg text-txt-2 min-h-screen">
  <header id="topbar" class="hidden sticky top-0 z-40 bg-bg border-b border-border"></header>

  <div id="app" class="min-h-[calc(100vh-8rem)]"></div>

  <nav id="bottomnav" class="hidden fixed bottom-0 left-0 right-0 z-40"></nav>

  <!-- Overlay-Container -->
  <div id="toasts" role="status" aria-live="assertive" aria-atomic="true" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center pointer-events-none"></div>
  <div id="modal-root"></div>

  <script>
    // Safari/PWA ignoriert user-scalable=no — Pinch-Zoom dort per Gesten-Event
    // unterbinden (WKWebView in der nativen App respektiert bereits das Meta-Tag).
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  </script>
  <script src="/static/js/vendor/jsqr.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
