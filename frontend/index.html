<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- Task D4: Hausstil b2-design ("Editorial Ledger"); theme-color = Fläche (--c-surface). -->
  <meta name="theme-color" content="#fdfbf6">
  <title>Werkzeug-Ausleihe</title>
  <link rel="stylesheet" href="/static/design/tokens.css">
  <link rel="stylesheet" href="/static/design/base.css">
  <link rel="stylesheet" href="/static/design/components.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/icons/icon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/icons/icon-180.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Hausfarben aus b2-design/tokens.css als CSS-Variablen gemappt — so übernehmen
    // alle bestehenden Tailwind-Klassen (bg-surface, text-txt, bg-accent, …) automatisch
    // den Hausstil, ohne dass jede Klasse in den Views geändert werden muss.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: 'var(--c-bg)',
            surface: 'var(--c-surface)',
            'surface-2': 'var(--c-surface-2)',
            border: 'var(--c-border)',
            accent: 'var(--c-accent)',
            'accent-ink': 'var(--c-on-accent)',
            txt: 'var(--c-text)',
            'txt-2': 'var(--c-text-muted)',
            muted: 'var(--c-text-faint)',
            'muted-2': 'var(--c-text-faint)',
            ok: 'var(--c-ok-ink)',
            lent: 'var(--c-info-ink)',
            broken: 'var(--c-err-ink)',
            maint: 'var(--c-warn-ink)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Fraunces', 'Iowan Old Style', 'Palatino Linotype', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SF Mono', 'Menlo', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    html, body { font-family: var(--font-ui); }
    /* Kein Pinch-/Doppeltipp-Zoom: versehentliches Zoomen ließ die ganze App
       horizontal "schwimmen" (Layout wirkt instabil). App-UI ist fix skaliert. */
    html { touch-action: pan-x pan-y; }
    button, a, input, select, textarea, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    /* iOS-Safe-Area (native App/PWA): Kopfzeile nicht unter der Statusleiste,
       Bottom-Nav nicht unter dem Home-Balken. Im Browser ist env() = 0. */
    #topbar { padding-top: env(safe-area-inset-top); }
    #bottomnav { padding-bottom: env(safe-area-inset-bottom); background: var(--c-surface); }
    /* Fixierte Aktionsleisten (AUSLEIHEN etc.) sitzen direkt über der
       Bottom-Nav — die ist um die Safe-Area höher als ihre 4rem (h-16). */
    .fixed.bottom-16 { bottom: calc(4rem + env(safe-area-inset-bottom)); }
    /* Seiten mit fixierter Aktionsleiste: genug Platz am Seitenende, damit der
       letzte Inhalt (z.B. NFC-Button) nicht hinter der Leiste verschwindet. */
    .pb-aktionsleiste { padding-bottom: calc(11rem + env(safe-area-inset-bottom)); }
    /* Werkzeug ist eine reine Mobil-Oberfläche (kein Seitenleisten-Gegenstück wie bei
       BAU.OS/Portal) — Kopf- und Fußleiste bleiben deshalb bei jeder Breite im
       .app-top/.tabbar-Look sichtbar, statt nur unterhalb der b2-design-Mobil-Schwelle. */
    #topbar.brand-top { display: flex; align-items: center; gap: var(--sp-3); position: sticky; top: 0; z-index: 30; height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) var(--sp-4) 0 var(--sp-4); background: var(--c-surface); border-bottom: 1px solid var(--c-border); }
    #topbar.brand-top .brand { padding: 0; gap: 8px; }
    /* Druck (Begleitliste Schärfdienst): nur das Blatt, ohne Kopf-/Fußleiste und Knöpfe. */
    @media print {
      #topbar, #bottomnav, .no-print, #toasts, #modal-root { display: none !important; }
      body { background: #fff !important; }
      main { padding: 0 !important; max-width: none !important; }
      @page { margin: 15mm; }
    }
    #bottomnav.tabbar-fest { display: grid; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); background: var(--c-surface); border-top: 1px solid var(--c-border); }
  </style>
</head>
<body class="bg-bg text-txt-2 min-h-screen">
  <header id="topbar" class="hidden sticky top-0 z-40 bg-bg border-b border-border"></header>

  <div id="app" class="min-h-[calc(100vh-8rem)]"></div>

  <nav id="bottomnav" class="hidden fixed bottom-0 left-0 right-0 z-40"></nav>

  <!-- Overlay-Container -->
  <div id="toasts" role="status" aria-live="assertive" aria-atomic="true" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center pointer-events-none"></div>
  <div id="modal-root"></div>

  <script>
    // Safari/PWA ignoriert user-scalable=no — Pinch-Zoom dort per Gesten-Event
    // unterbinden (WKWebView in der nativen App respektiert bereits das Meta-Tag).
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  </script>
  <script src="/static/js/vendor/jsqr.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
